<!DOCTYPE html>
<html>
<head>
    <title>Диаграмма задач по месяцам</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Диаграмма задач по месяцам</h1>
        <canvas id="issuesChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('issuesChart').getContext('2d');
        
        // Данные о задачах по месяцам
        const data = {
            labels: ['Сентябрь 2025', 'Ноябрь 2025'],
            datasets: [{
                label: 'Количество задач',
                data: [3, 1],
                backgroundColor: [
                    'rgba(54, 162, 235, 0.6)',
                    'rgba(255, 99, 132, 0.6)'
                ],
                borderColor: [
                    'rgba(54, 162, 235, 1)',
                    'rgba(255, 99, 132, 1)'
                ],
                borderWidth: 1
            }]
        };

        // Конфигурация диаграммы
        const config = {
            type: 'bar',
            data: data,
            options: {
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'Распределение задач по месяцам'
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            stepSize: 1
                        }
                    }
                }
            }
        };

        // Создание диаграммы
        const chart = new Chart(ctx, config);
    </script>
</body>
